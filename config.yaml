bot:
  token:    "YOUR_PLATFORM_BOT_TOKEN"   # 平台主机器人 Token，从 @BotFather 获取
  admin_id: 123456789                   # 平台拥有者的 Telegram 用户 ID
  name:     "双向私聊机器人工厂"
  version:  "4.0.0"

# 平台主机器人加载的模块（机器人工厂）
modules:
  - modules.platform_module

# 每个用户创建的机器人自动加载的功能模块
tenant_modules:
  - modules.private_chat_module   # 双向私聊（DM / Topics 模式）
  - modules.customize_module      # 交互式自定义（启动语/按钮/强制订阅/广播）
  - modules.auto_reply_module     # 自动回复 + 关键词过滤

# 管理后台小程序（Telegram Mini App）
# 配置后，租户机器人管理员发送 /start 时将跳出提醒与按钮，
# 点击按钮自动登录进入 Web 管理后台（替代私聊内联控制面板）。
webapp:
  enabled: false                        # 设为 true 以启用 Web 管理后台
  host:    "0.0.0.0"                    # 监听地址
  port:    8080                         # 监听端口
  # 部署后外部可访问的 HTTPS 公网地址（Telegram 要求 WebApp 使用 HTTPS）
  # 例如：https://mybot.example.com
  url:     ""

# 租户机器人可自定义的提示文案（默认值）
messages:
  welcome:       "👋 你好！直接发送消息即可联系管理员，我们会尽快回复你。"
  admin_welcome: "👋 管理员你好！用户的消息会转发到这里，直接「回复」某条消息即可回复对应用户。"
  received:      ""
  # 用户消息成功转发给管理员后的「已发送」轻提示（默认 5 秒后自动删除，保持对话整洁）。
  sent_ack:      "✅ 已发送成功，管理员会尽快回复你。"
  banned:        "⛔ 你已被封禁，无法发送消息。"
  # 可选品牌署名页脚：留空表示关闭（默认）。设置后会追加到用户欢迎语末尾，便于品牌传播。
  brand:         ""
