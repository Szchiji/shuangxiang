<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机器人管理后台</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <div id="loading"><div class="spinner"></div><p>正在验证身份…</p></div>

    <div id="main" style="display:none">
      <!-- ── Sidebar ─────────────────────────────────────────────────── -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span id="bot-name" class="sidebar-title">🤖 管理后台</span>
          <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="收起侧栏">&#9776;</button>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-item active" data-tab="settings">
            <span class="nav-icon">⚙️</span><span class="nav-label">基本设置</span>
          </button>
          <button class="nav-item" data-tab="auto-reply">
            <span class="nav-icon">💬</span><span class="nav-label">自动回复</span>
          </button>
          <button class="nav-item" data-tab="force-sub">
            <span class="nav-icon">📢</span><span class="nav-label">强制订阅</span>
          </button>
          <button class="nav-item" data-tab="broadcast">
            <span class="nav-icon">📣</span><span class="nav-label">群发广告</span>
          </button>
          <button class="nav-item" data-tab="banned">
            <span class="nav-icon">⛔</span><span class="nav-label">封禁管理</span>
          </button>
          <button class="nav-item" data-tab="stats">
            <span class="nav-icon">📊</span><span class="nav-label">数据统计</span>
          </button>
        </nav>
      </aside>

      <!-- ── Main content ───────────────────────────────────────────── -->
      <main id="content">

        <!-- Settings -->
        <section id="tab-settings" class="tab active">
          <div class="page-header"><h2>⚙️ 基本设置</h2></div>
          <div class="card">
            <h3 class="card-title">欢迎语设置</h3>
            <label class="field-label">启动欢迎语
              <textarea id="welcome-text" rows="4"
                placeholder="用户发送 /start 时显示的欢迎语"></textarea>
            </label>
            <button id="save-welcome-text" class="btn-primary">💾 保存欢迎语</button>
            <div id="welcome-text-msg" class="msg"></div>
          </div>
          <div class="card">
            <h3 class="card-title">欢迎按钮设置</h3>
            <label class="field-label">欢迎语内联按钮
              <div id="welcome-buttons-builder" class="btn-builder"></div>
              <button class="btn-ghost btn-sm" id="welcome-buttons-add-row">＋ 添加一行按钮</button>
            </label>
            <button id="save-welcome-buttons" class="btn-primary">💾 保存欢迎按钮</button>
            <div id="welcome-buttons-msg" class="msg"></div>
          </div>
          <div class="card">
            <h3 class="card-title">安全开关</h3>
            <div class="toggles">
              <div class="toggle-row">
                <span>🛡 防刷屏过滤</span>
                <label class="switch"><input type="checkbox" id="antiflood"><span class="slider"></span></label>
              </div>
              <div class="toggle-row">
                <span>🔤 拦截英文消息</span>
                <label class="switch"><input type="checkbox" id="alphabet-latin"><span class="slider"></span></label>
              </div>
            </div>
            <button id="save-security-settings" class="btn-primary">💾 保存安全设置</button>
            <div id="settings-msg" class="msg"></div>
          </div>
        </section>

        <!-- Auto Reply -->
        <section id="tab-auto-reply" class="tab">
          <div class="page-header"><h2>💬 自动回复规则</h2></div>
          <div class="card" id="ar-list-view">
            <div class="section-toolbar">
              <input type="text" id="ar-search" placeholder="搜索关键词或回复内容">
              <select id="ar-filter-match">
                <option value="">全部匹配方式</option>
                <option value="contains">包含</option>
                <option value="exact">完全匹配</option>
                <option value="startswith">开头匹配</option>
                <option value="regex">正则表达式</option>
              </select>
              <button id="ar-start-create" class="btn-primary section-toolbar-btn">➕ 新增自动回复</button>
            </div>
            <div id="ar-list"></div>
          </div>

          <div class="card ar-form" id="ar-editor-view" style="display:none">
            <div class="subview-header">
              <button id="ar-back" class="btn-ghost btn-sm">⬅️ 返回列表</button>
            </div>
            <h3 id="ar-form-title">➕ 添加规则</h3>
            <input type="hidden" id="ar-edit-id" value="">
            <label class="field-label">关键词
              <input type="text" id="ar-keyword" placeholder="触发关键词">
            </label>
            <label class="field-label">回复内容
              <textarea id="ar-reply" rows="3" placeholder="自动回复的内容"></textarea>
            </label>
            <label class="field-label">匹配方式
              <select id="ar-match">
                <option value="contains">包含</option>
                <option value="exact">完全匹配</option>
                <option value="startswith">开头匹配</option>
                <option value="regex">正则表达式</option>
              </select>
            </label>
            <label class="field-label">内联按钮
              <div id="ar-buttons-builder" class="btn-builder"></div>
              <button class="btn-ghost btn-sm" id="ar-buttons-add-row">＋ 添加一行按钮</button>
            </label>
            <div class="form-actions">
              <button id="ar-submit" class="btn-primary">➕ 添加</button>
              <button id="ar-cancel" class="btn-ghost" style="display:none">取消</button>
            </div>
            <div id="ar-msg" class="msg"></div>
          </div>
        </section>

        <!-- Force Subscribe -->
        <section id="tab-force-sub" class="tab">
          <div class="page-header"><h2>📢 强制订阅</h2></div>
          <div class="card" id="fsub-list-view">
            <div class="section-toolbar">
              <button id="fsub-start-add" class="btn-primary section-toolbar-btn">➕ 新增频道</button>
              <button id="fsub-open-settings" class="btn-ghost">⚙️ 规则设置</button>
            </div>
            <p class="hint-text">⚠️ 需将本机器人设为各频道的管理员，否则无法校验成员资格。</p>
            <div id="fsub-list"></div>
          </div>

          <div class="card" id="fsub-editor-view" style="display:none">
            <div class="subview-header">
              <button id="fsub-back-from-editor" class="btn-ghost btn-sm">⬅️ 返回列表</button>
            </div>
            <h3 id="fsub-editor-title" class="card-title">➕ 添加频道</h3>
            <label class="field-label">频道名称
              <input type="text" id="fsub-add-title" placeholder="官方频道（可留空自动获取）">
            </label>
            <label class="field-label">频道标识（@用户名 或 -100 数字 ID）
              <input type="text" id="fsub-add-chat" placeholder="@mychannel 或 -1001234567890">
            </label>
            <label class="field-label">加入链接（可留空自动生成）
              <input type="text" id="fsub-add-url" placeholder="https://t.me/mychannel">
            </label>
            <div class="form-actions">
              <button id="fsub-save-btn" class="btn-primary">💾 保存频道</button>
              <button id="fsub-cancel-btn" class="btn-ghost">取消</button>
            </div>
            <div id="fsub-msg" class="msg"></div>
          </div>

          <div class="card" id="fsub-settings-view" style="display:none">
            <div class="subview-header">
              <button id="fsub-back-from-settings" class="btn-ghost btn-sm">⬅️ 返回列表</button>
            </div>
            <h3 class="card-title">规则设置</h3>
            <div class="toggles">
              <div class="toggle-row">
                <span>📢 强制订阅开关</span>
                <label class="switch"><input type="checkbox" id="force-sub-on"><span class="slider"></span></label>
              </div>
            </div>
            <label class="field-label">自定义拦截提示语
              <textarea id="fsub-msg-text" rows="3"
                placeholder="🔒 请先加入以下频道后再继续：（留空使用默认）"></textarea>
            </label>
            <button id="fsub-save-settings" class="btn-primary">💾 保存规则设置</button>
            <div id="fsub-save-msg-result" class="msg"></div>
          </div>
        </section>

        <!-- Broadcast -->
        <section id="tab-broadcast" class="tab">
          <div class="page-header"><h2>📣 群发广告</h2></div>
          <div class="card">
            <p class="hint-text">向所有活跃用户群发消息，支持图片、内联按钮和静默推送。</p>
            <label class="field-label">图片 URL（可选）
              <input type="text" id="bc-photo" placeholder="https://... （留空则仅发文字）">
            </label>
            <label class="field-label">消息内容
              <textarea id="bc-text" rows="6"
                placeholder="在此输入要群发的内容，支持 &lt;b&gt;粗体&lt;/b&gt;、&lt;i&gt;斜体&lt;/i&gt;、&lt;a href=&quot;链接&quot;&gt;超链接&lt;/a&gt; 等 HTML 标签"></textarea>
            </label>
            <label class="field-label">内联按钮（可选）
              <div id="bc-buttons-builder" class="btn-builder"></div>
              <button class="btn-ghost btn-sm" id="bc-buttons-add-row">＋ 添加一行按钮</button>
            </label>
            <div class="toggles" style="margin-bottom:12px">
              <div class="toggle-row">
                <span>🔕 静默推送（不提醒用户）</span>
                <label class="switch"><input type="checkbox" id="bc-silent"><span class="slider"></span></label>
              </div>
            </div>
            <button id="bc-send" class="btn-primary">🚀 发送群发</button>
            <div id="bc-msg" class="msg"></div>
          </div>
        </section>

        <!-- Banned -->
        <section id="tab-banned" class="tab">
          <div class="page-header"><h2>⛔ 封禁用户管理</h2></div>
          <div class="card">
            <label class="field-label">搜索封禁用户
              <input type="text" id="banned-search" placeholder="输入用户 ID、用户名或昵称">
            </label>
            <div id="banned-msg" class="msg"></div>
          </div>
          <div id="banned-list"></div>
        </section>

        <!-- Stats -->
        <section id="tab-stats" class="tab">
          <div class="page-header"><h2>📊 数据统计</h2></div>
          <div id="stats-content"></div>
        </section>

      </main>
    </div>

    <div id="error-msg" style="display:none" class="error-box"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
